<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Generate your personalized Expert on Geppetto certificate." />
  <title>Geppetto Expert Certificate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="badge" aria-hidden="true">★</div>
      <p class="eyebrow">GEPPETTO QUIZ</p>
      <h1 id="page-title">Generate your certificate</h1>
      <p class="intro">Enter your full name exactly as you would like it to appear on the certificate.</p>

      <form id="certificate-form" class="generator" novalidate>
        <label for="full-name">Full name</label>
        <div class="input-row">
          <input
            id="full-name"
            name="full-name"
            type="text"
            maxlength="80"
            autocomplete="name"
            placeholder="Type your full name"
            aria-describedby="name-help name-error"
          />
          <button class="primary-button" type="submit">Generate certificate</button>
        </div>
        <p id="name-help" class="help-text">Your name is processed only in your browser and is not stored or shared.</p>
        <p id="name-error" class="error-text" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="result-section" class="result-section" aria-labelledby="preview-title" hidden>
      <div class="result-header">
        <div>
          <p class="eyebrow">PREVIEW</p>
          <h2 id="preview-title">Your certificate is ready</h2>
        </div>
        <button id="edit-name" class="text-button" type="button">Edit name</button>
      </div>

      <div class="canvas-frame">
        <canvas id="certificate-canvas" aria-label="Certificate preview"></canvas>
      </div>

      <div class="actions">
        <button id="download-png" class="secondary-button" type="button">Download PNG</button>
      </div>
      <p id="download-status" class="status-text" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <span>Geppetto Expert Certificate</span>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha512-qZvrmS2ekKPF2mSznTQsxqPgnpkI4DNTlrdUmTzrDgektczlKNRRhy5X5AAZTdQfLLQmRr8b7e50g7B1xO9m8g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="script.js"></script>
</body>
</html>
